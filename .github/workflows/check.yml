name: Local tests and configuration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-cfn.txt -r requirements-cdk.txt
      - run: python scripts/synth_cdk.py --check
      - run: python scripts/build_cdk_permissions.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_cloudformation.py --check
      - run: cfn-lint infra/cloudformation/template.json --regions ap-northeast-1
      - run: cfn-lint infra/cdk/template.json --regions ap-northeast-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      - working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test -no-color
